name: Swara v1.0.2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Swara v1.0.2 & Swara TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Swara v1.0.2 APK (HP & Tablet)
        run: ./gradlew assembleUniversalGmsRelease --no-daemon --console=plain

      - name: Build Swara TV v1.0.2 APK (Google TV)
        run: ./gradlew assembleUniversalTvRelease --no-daemon --console=plain

      - name: Prepare APK Artifacts
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/universalGms/release/*.apk release-apks/Swara-v1.0.2.apk
          cp app/build/outputs/apk/universalTv/release/*.apk release-apks/Swara-TV-v1.0.2.apk
          ls -lh release-apks/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swara-apks
          path: release-apks/*.apk

  build-windows:
    name: Build Swara Desktop Windows (.exe)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Windows Portable EXE
        working-directory: swara-desktop-windows
        run: |
          npm install
          npm run build:win

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: swara-windows
          path: swara-desktop-windows/dist/*.exe

  publish-release:
    name: Publish Swara v1.0.2 Pre-release
    runs-on: ubuntu-latest
    needs: [ build-android, build-windows ]
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Publish GitHub Pre-release (Swara v1.0.2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p final-release
          find all-artifacts -type f \( -name "*.apk" -o -name "*.exe" \) -exec cp {} final-release/ \;
          ls -lh final-release/
          gh release delete v1.0.2 -R ${{ github.repository }} --yes 2>/dev/null || true
          gh release create v1.0.2 final-release/* -R ${{ github.repository }} \
            --title "Swara v1.0.2" \
            --notes "Swara v1.0.2 — Basis baru 8.4.3 (Audio Lab 2.0: Stage 3D, 8D Audio, FX Presets, Dolby Atmos real-time; Cloud Backup Dropbox/OneDrive/WebDAV; Tinted Lyrics; Unison Lyrics; SoundCloud Link), Swara Wrap Mingguan & Bulanan full Bahasa Indonesia + tombol Bagikan, dan 100% mandiri tanpa VPS." \
            --prerelease

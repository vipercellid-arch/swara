name: Build Swara v4.9.2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Swara v4.9.2 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Swara v4.9.2 APK
        run: |
          ./gradlew assembleUniversalGmsDebug --no-daemon --max-workers=2 --stacktrace --console=plain --warning-mode summary
          mkdir -p dist-apk
          cp app/build/outputs/apk/universalGms/debug/*.apk dist-apk/Swara-v4.9.2.apk

      - name: Upload Swara v4.9.2 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swara-v4.9.2-APK
          path: dist-apk/Swara-v4.9.2.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release (Auto-Update APK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v4.9.2"
          TITLE="Swara v4.9.2"
          NOTES="Pembaruan Swara v4.9.2: perbaikan layar masuk awal, auto-update langsung dari GitHub Releases, penghapusan sensor gyroscope demi suhu dingin, dan sinkronisasi lintas perangkat lengkap dengan lirik live."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-apk/Swara-v4.9.2.apk --clobber
          else
            gh release create "$TAG" dist-apk/Swara-v4.9.2.apk --title "$TITLE" --notes "$NOTES" --latest
          fi

      - name: Auto-Publish APK to Swara Cloud VPS
        continue-on-error: true
        env:
          SWARA_CI_TOKEN: ${{ secrets.SWARA_CI_TOKEN }}
        run: |
          if [ -n "$SWARA_CI_TOKEN" ]; then
            curl -fSL -X POST \
              -H "Authorization: Bearer ${SWARA_CI_TOKEN}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @dist-apk/Swara-v4.9.2.apk \
              "https://swaraapp.my.id/api/ci/upload-apk?version=4.9.2&versionCode=492"
          else
            echo "SWARA_CI_TOKEN belum diisi, lewati auto-publish VPS."
          fi

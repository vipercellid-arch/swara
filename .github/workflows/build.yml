name: Build Swara v4.9.4 & Swara TV APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build Swara v4.9.4 & Swara TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Swara v4.9.4 APK (HP & Tablet)
        run: |
          ./gradlew assembleUniversalGmsDebug --no-daemon --max-workers=2 --stacktrace --console=plain --warning-mode summary
          mkdir -p dist-apk
          cp app/build/outputs/apk/universalGms/debug/*.apk dist-apk/Swara-v4.9.4.apk

      - name: Build Swara TV v4.9.4 APK (Google TV)
        run: |
          ./gradlew assembleUniversalTvDebug --no-daemon --max-workers=2 --stacktrace --console=plain --warning-mode summary
          mkdir -p dist-apk
          cp app/build/outputs/apk/universalTv/debug/*.apk dist-apk/Swara-TV-v4.9.4.apk

      - name: Upload Swara v4.9.4 & Swara TV APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Swara-v4.9.4-APKs
          path: dist-apk/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release (Swara & Swara TV)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v4.9.4"
          TITLE="Swara v4.9.4 & Swara TV"
          NOTES="Swara v4.9.4 (Android & Tablet) dan Swara TV v4.9.4 (Google TV / Android TV)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-apk/Swara-v4.9.4.apk dist-apk/Swara-TV-v4.9.4.apk --clobber
          else
            gh release create "$TAG" dist-apk/Swara-v4.9.4.apk dist-apk/Swara-TV-v4.9.4.apk --title "$TITLE" --notes "$NOTES" --latest
          fi

      - name: Auto-Publish APK to Swara Cloud VPS
        continue-on-error: true
        env:
          SWARA_CI_TOKEN: ${{ secrets.SWARA_CI_TOKEN }}
        run: |
          if [ -n "$SWARA_CI_TOKEN" ]; then
            curl -fSL -X POST \
              -H "Authorization: Bearer ${SWARA_CI_TOKEN}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @dist-apk/Swara-v4.9.4.apk \
              "https://swaraapp.my.id/api/ci/upload-apk?platform=android&version=4.9.4&versionCode=494"
            curl -fSL -X POST \
              -H "Authorization: Bearer ${SWARA_CI_TOKEN}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @dist-apk/Swara-TV-v4.9.4.apk \
              "https://swaraapp.my.id/api/ci/upload-apk?platform=tv&version=4.9.4&versionCode=494"
          else
            echo "SWARA_CI_TOKEN belum diisi, lewati auto-publish VPS."
          fi
